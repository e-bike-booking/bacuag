name: sakay_bacuag
description: E-Sikad passenger and rider starter app.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.17.1
  geolocator: ^14.0.2
  http: ^1.2.0
  shared_preferences: ^2.3.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0
  path_provider: ^2.1.6
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/boundaries/
    - assets/sounds/
    - assets/logo.png
